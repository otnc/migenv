name: ci

on:
  push:
    branches: [main, release/*]
    paths-ignore: &docs-only
      - '**.md'
      - 'base/**'
      - '.agents/**'
      - 'skills-lock.json'
      - '.kiritanconfig'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, release/*]
    paths-ignore: *docs-only

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run lint:pkg
      - if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  compat:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run test:compat
